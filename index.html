<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>三创演示：AI 映射处理数据</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .status { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: #f3f6ff; }
    .status .hint { color:#666; font-size:14px; margin-top:6px; }
    .spinner { display:inline-block; width:14px; height:14px; border:2px solid #bbb; border-top-color:transparent; border-radius:50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right:8px;}
    @keyframes spin { to { transform: rotate(360deg);} }
    .disabled { opacity:0.6; pointer-events:none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>三创演示：AI 映射处理数据</h1>
    <p style="color:#888">版本：demo-no-log</p>
    <p class="muted">上传参数表和报表，后台调用 AI 处理并生成结果文件。</p>

    <div class="card">
      <h2>1) 上传文件</h2>
      <div class="row">
        <label>
          参数表（Excel）
          <input id="paramFile" type="file" accept=".xlsx,.xls"/>
        </label>
        <label>
          报表（Excel）
          <input id="reportFile" type="file" accept=".xlsx,.xls"/>
        </label>
      </div>

      <div class="actions">
        <button id="runBtn">开始处理</button>
        <a id="downloadBtn" class="btn secondary disabled" href="javascript:void(0)">下载 最终结果.xlsx</a>
      </div>

      <div id="statusBox" class="status" style="display:none;">
        <div id="statusLine"></div>
        <div class="hint" id="statusHint"></div>
      </div>
    </div>
  </div>

<script>
let statusTimer = null;

const paramFile = document.getElementById("paramFile");
const reportFile = document.getElementById("reportFile");
const runBtn = document.getElementById("runBtn");
const downloadBtn = document.getElementById("downloadBtn");

const statusBox = document.getElementById("statusBox");
const statusLine = document.getElementById("statusLine");
const statusHint = document.getElementById("statusHint");

function showStatus(htmlLine, hint="") {
  statusBox.style.display = "block";
  statusLine.innerHTML = htmlLine;
  statusHint.textContent = hint;
}

function disableDownload() {
  downloadBtn.classList.add("disabled");
  downloadBtn.href = "javascript:void(0)";
}
function enableDownload(url) {
  downloadBtn.classList.remove("disabled");
  downloadBtn.href = url;
}

async function fetchJsonNoCache(url) {
  const u = new URL(url, window.location.origin);
  u.searchParams.set("t", Date.now().toString());
  const r = await fetch(u.toString(), { cache: "no-store" });
  return await r.json();
}

function stopPolling() {
  if (statusTimer) clearInterval(statusTimer);
  statusTimer = null;
}

runBtn.addEventListener("click", async () => {
  if (!paramFile.files[0] || !reportFile.files[0]) {
    alert("请先选择 参数表 和 报表 两个文件");
    return;
  }

  runBtn.disabled = true;
  disableDownload();
  stopPolling();

  showStatus('<span class="spinner"></span>正在提交任务…', "请不要关闭页面");

  const form = new FormData();
  form.append("param_file", paramFile.files[0]);
  form.append("report_file", reportFile.files[0]);

  const resp = await fetch("/api/start", { method: "POST", body: form, cache: "no-store" });
  const data = await resp.json();

  if (!resp.ok) {
    showStatus("❌ 启动失败", data.error || "未知错误");
    runBtn.disabled = false;
    return;
  }

  showStatus('<span class="spinner"></span>处理中…', "通常需要 2–3 分钟（取决于报表大小和 AI 响应）");

  // 只轮询 status：稳定、简单
  const check = async () => {
    try {
      const st = await fetchJsonNoCache(data.status_url);
      if (st.state === "done") {
        stopPolling();
        enableDownload(data.download_url);
        showStatus("✅ 处理完成！", "点击“下载 最终结果.xlsx”获取输出文件");
        runBtn.disabled = false;
      } else if (st.state === "error") {
        stopPolling();
        showStatus("❌ 处理失败", st.error || "未知错误");
        runBtn.disabled = false;
      }
    } catch (e) {
      // 网络抖动时不打断演示
    }
  };

  await check();
  statusTimer = setInterval(check, 1500);
});
</script>
</body>
</html>
