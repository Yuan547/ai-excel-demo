<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>三创演示：AI 映射处理数据</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>三创演示：AI 映射处理数据</h1>
    <p class="muted">上传参数表和报表，后台调用 AI 处理并生成结果文件。</p>

    <div class="card">
      <h2>1) 上传文件</h2>
      <div class="row">
        <label>
          参数表（Excel）
          <input id="paramFile" type="file" accept=".xlsx,.xls"/>
        </label>
        <label>
          报表（Excel）
          <input id="reportFile" type="file" accept=".xlsx,.xls"/>
        </label>
      </div>

      <div class="actions">
        <button id="runBtn">开始处理</button>
        <a id="downloadLink" class="btn secondary disabled" href="javascript:void(0)">下载 最终结果.xlsx</a>
      </div>
    </div>

    <div class="card">
      <h2>2) 日志</h2>
      <pre id="log" class="log">等待开始…</pre>
    </div>
  </div>

<script>
let currentTaskId = null;
let logTimer = null;
let statusTimer = null;
let lastLogText = "";

const paramFile = document.getElementById("paramFile");
const reportFile = document.getElementById("reportFile");
const runBtn = document.getElementById("runBtn");
const logEl = document.getElementById("log");
const downloadLink = document.getElementById("downloadLink");

function setLog(text) {
  if (text === lastLogText) return; // 避免重复刷新造成闪烁
  lastLogText = text;
  logEl.textContent = text;
  logEl.scrollTop = logEl.scrollHeight;
}

function disableDownload() {
  downloadLink.classList.add("disabled");
  downloadLink.href = "javascript:void(0)";
  downloadLink.style.pointerEvents = "none";
  downloadLink.style.opacity = "0.6";
}

function enableDownload(url) {
  downloadLink.href = url;
  downloadLink.classList.remove("disabled");
  downloadLink.style.pointerEvents = "auto";
  downloadLink.style.opacity = "1";
}

// ✅ 防缓存：cache:no-store + URL加时间戳
async function fetchJsonNoCache(url) {
  const u = new URL(url, window.location.origin);
  u.searchParams.set("t", Date.now().toString());
  const r = await fetch(u.toString(), { cache: "no-store" });
  return await r.json();
}

async function pollLog(logUrl) {
  try {
    const logData = await fetchJsonNoCache(logUrl);
    const lines = (logData.logs || []);
    setLog(lines.join("\n") || "暂无日志");
  } catch (e) {
    // 忽略偶发网络波动
  }
}

async function pollStatus(statusUrl, downloadUrl) {
  try {
    const st = await fetchJsonNoCache(statusUrl);

    if (st.state === "done") {
      stopPolling();
      enableDownload(downloadUrl);
      runBtn.disabled = false;
      // 给用户一个明确提示（可选）
      setLog(lastLogText + "\n✅ 处理完成，可下载结果文件。");
    } else if (st.state === "error") {
      stopPolling();
      runBtn.disabled = false;
      alert("处理失败：" + (st.error || "未知错误"));
    }
  } catch (e) {
    // 忽略偶发网络波动
  }
}

function stopPolling() {
  if (logTimer) clearInterval(logTimer);
  if (statusTimer) clearInterval(statusTimer);
  logTimer = null;
  statusTimer = null;
}

runBtn.addEventListener("click", async () => {
  if (!paramFile.files[0] || !reportFile.files[0]) {
    alert("请先选择 参数表 和 报表 两个文件");
    return;
  }

  runBtn.disabled = true;
  disableDownload();
  setLog("正在提交任务…");
  stopPolling();

  const form = new FormData();
  form.append("param_file", paramFile.files[0]);
  form.append("report_file", reportFile.files[0]);

  const resp = await fetch("/api/start", { method: "POST", body: form, cache: "no-store" });
  const data = await resp.json();

  if (!resp.ok) {
    setLog("出错：" + (data.error || "未知错误"));
    runBtn.disabled = false;
    return;
  }

  currentTaskId = data.task_id;
  setLog("任务已创建，后台处理中…（日志将持续刷新）");

  // ✅ 分开轮询：日志更频繁，状态稍慢一些
  logTimer = setInterval(() => pollLog(data.log_url), 1000);
  statusTimer = setInterval(() => pollStatus(data.status_url, data.download_url), 1500);

  // 立刻拉一次
  pollLog(data.log_url);
  pollStatus(data.status_url, data.download_url);
});
</script>
</body>
</html>
